<h1>hello, welcome to distance-to-origin calculator</h1>

<h2>please, insert x and y coordinates</h2>

<form id="f">
    <input type="number" step="any" name="x" placeholder="x" />
    <br>
    <br>
    <br>
    <input type="number" step="any" name="y" placeholder="y" />
    <br>
    <br>
    <br>
    <button type="submit">calculate</button>
</form>

<br>
<br>
<p id="r"></p>

<script>
    f.onsubmit = async e => {
        e.preventDefault();
        const res = await fetch("calculate/calc", {
            method: "POST",
            headers:{"Content-Type": "application/json"},
            body: JSON.stringify({x: +f.x.value, y: +f.y.value})
        });
        r.textContent = "result: "+await res.text();
    };
</script>
